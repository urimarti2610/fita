name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      # Attach the zips to the GitHub release. Store submission stays manual.
      # 0.x versions are previews: published as pre-releases, with install steps.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          [[ "$GITHUB_REF_NAME" == v0.* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" apps/extension/dist/*.zip \
            --verify-tag --generate-notes $prerelease \
            --notes-file .github/release-notes.md
