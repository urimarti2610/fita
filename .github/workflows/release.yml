name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      # The emphasis font (fonts/), zipped with its licence and instructions.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build the font
        run: |
          pip install -r fonts/requirements.txt
          python fonts/build.py
          python -m unittest discover -s fonts/tests
          zip -j "fita-sans-${GITHUB_REF_NAME#v}.zip" fonts/dist/*.ttf fonts/dist/*.woff2 fonts/OFL.txt fonts/README.md
      - run: python3 plugins/calibre/build.py
      # Attach the zips and the LibreOffice .oxt to the GitHub release. Store submission stays manual.
      # 0.x versions are previews: published as pre-releases, with install steps.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          [[ "$GITHUB_REF_NAME" == v0.* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" apps/extension/dist/*.zip fita-sans-*.zip plugins/calibre/dist/*.zip addons/libreoffice/dist/*.oxt \
            --verify-tag --generate-notes $prerelease \
            --notes-file .github/release-notes.md
