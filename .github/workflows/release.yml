name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      # Attach the zips to the GitHub release. Store submission stays manual.
      - run: gh release create "$GITHUB_REF_NAME" apps/extension/dist/*.zip --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
