name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @fita/extension exec playwright install --with-deps chromium
      - run: pnpm e2e
      # The converter's EPUB output must pass the official validator.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: epubcheck
        env:
          EPUBCHECK: "5.4.0"
        run: |
          curl -fsSL -o epubcheck.zip "https://github.com/w3c/epubcheck/releases/download/v${EPUBCHECK}/epubcheck-${EPUBCHECK}.zip"
          unzip -q epubcheck.zip
          EPUB_SAMPLES_DIR="$PWD/epub-samples" pnpm --filter @fita/web exec vitest run test/epub-samples.test.ts
          for f in epub-samples/*.epub; do java -jar "epubcheck-${EPUBCHECK}/epubcheck.jar" "$f"; done
