name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: calibre plugin
        run: |
          python3 -m unittest discover -s plugins/calibre/tests -v
          python3 plugins/calibre/build.py
      - name: KOReader plugin
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends luajit
          luajit plugins/koreader/spec/run.lua
          # fita_unicode.lua must match the Python engine it is generated from.
          python3 plugins/koreader/tools/gen_unicode.py
          git diff --exit-code plugins/koreader/fita.koplugin/fita_unicode.lua
          python3 plugins/koreader/build.py
      - run: pnpm --filter @fita/extension exec playwright install --with-deps chromium
      - run: pnpm e2e
      # The converter's EPUB output must pass the official validator.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: epubcheck
        env:
          EPUBCHECK: "5.4.0"
        run: |
          curl -fsSL -o epubcheck.zip "https://github.com/w3c/epubcheck/releases/download/v${EPUBCHECK}/epubcheck-${EPUBCHECK}.zip"
          unzip -q epubcheck.zip
          EPUB_SAMPLES_DIR="$PWD/epub-samples" pnpm --filter @fita/web exec vitest run test/epub-samples.test.ts
          for f in epub-samples/*.epub; do java -jar "epubcheck-${EPUBCHECK}/epubcheck.jar" "$f"; done
          # The calibre plugin's output too (it re-emphasizes the samples).
          mkdir -p calibre-samples
          for f in epub-samples/*.epub; do
            python3 plugins/calibre/convert.py "$f" "calibre-samples/$(basename "$f")" --style fade
            java -jar "epubcheck-${EPUBCHECK}/epubcheck.jar" "calibre-samples/$(basename "$f")"
          done

  # The OpenType emphasis font (fonts/): build it and shape test text with HarfBuzz.
  font:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fonts/requirements.txt
      - run: pip install -r fonts/requirements.txt
      - run: python fonts/build.py
      - run: python -m unittest discover -s fonts/tests -v

  # Native Android shell of the reader app (apps/mobile): a debug APK, built and kept
  # as a workflow artifact, never published. See docs/mobile.md for release builds.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fita/mobile exec cap telemetry off
      - run: pnpm --filter @fita/mobile sync
      - name: Debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: fita-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
