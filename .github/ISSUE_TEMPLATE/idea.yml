name: Idea or request
description: Something that would make reading more comfortable.
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would help you, and why?
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Ground rules
      description: See CONTRIBUTING.md.
      options:
        - label: It works without servers, accounts or data collection.
          required: true
